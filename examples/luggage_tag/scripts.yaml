# Luggage Tag — Home Assistant Scripts
#
# Prints fold-over adhesive luggage tags using only the escpos_printer
# integration's built-in services (print_text_utf8, print_qr, feed).
# No external scripts or images required.
#
# Physical layout of the printed strip:
#
#   [Back face]            ← printed first; upside-down when folded
#   [  handle gap  ]       ← blank space that wraps around the handle
#   [- FOLD HERE  -]
#   [  small gap   ]
#   [Front face]           ← printed last; right-side-up, primary side
#   [cut]
#
# Prerequisites:
#   1. Add the input helpers from input_helpers.yaml to your HA config
#   2. Merge the script blocks below into your scripts.yaml
#   3. Replace YOUR_DEVICE_ID with your printer's device ID
#   4. Restart Home Assistant (or reload scripts)
#
# Three designs are included:
#   classic  — Airline-style with borders and QR vCard
#   bold     — Huge text for maximum visibility at a distance
#   contact  — Structured field layout with prominent QR vCard

# =====================================================================
# Jinja2 shorthand variables used throughout (defined in each script
# via the "variables:" key so templates stay readable).
# =====================================================================

script:
  # =================================================================
  # Master dispatcher — picks the design from input_select
  # =================================================================
  print_luggage_tag:
    alias: Print Luggage Tag
    icon: mdi:bag-suitcase
    description: >-
      Print a fold-over luggage tag using the design selected in
      input_select.luggage_tag_design.
    sequence:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.luggage_tag_design
                state: bold
            sequence:
              - service: script.print_luggage_tag_bold
          - conditions:
              - condition: state
                entity_id: input_select.luggage_tag_design
                state: contact
            sequence:
              - service: script.print_luggage_tag_contact
        default:
          - service: script.print_luggage_tag_classic

  # =================================================================
  # DESIGN 1 — Classic Airline
  # =================================================================
  #
  # ================================================
  #                L A X
  # ================================================
  #            JFK  -->  LAX
  #
  #          JOHN Q. SMITH
  #
  #      UA 1234  |  28 FEB 2026
  #        +1 (555) 123-4567
  #        john@example.com
  #
  #             [QR vCard]
  #
  # ================================================
  #
  print_luggage_tag_classic:
    alias: Print Luggage Tag (Classic)
    icon: mdi:bag-suitcase
    variables:
      dest: "{{ states('input_text.luggage_destination') | upper | trim }}"
      origin: "{{ states('input_text.luggage_origin') | upper | trim }}"
      name: "{{ states('input_text.luggage_passenger_name') | upper | trim }}"
      flight: "{{ states('input_text.luggage_flight_number') | upper | trim }}"
      date: "{{ states('input_text.luggage_travel_date') | upper | trim }}"
      phone: "{{ states('input_text.luggage_phone') | trim }}"
      email: "{{ states('input_text.luggage_email') | trim }}"
      device: YOUR_DEVICE_ID
    sequence:
      # --- BACK FACE (simple identifier) ---
      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: "================================================"
          align: center
          bold: true
          cut: none

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: "{{ dest }}"
          align: center
          bold: true
          width: triple
          height: double
          cut: none

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: >-
            ================================================

            {{ name }}
            {% if phone | length > 0 %}{{ phone }}{% endif %}

            IF FOUND PLEASE CALL ABOVE
          align: center
          bold: true
          cut: none

      # --- HANDLE GAP + FOLD LINE ---
      - service: escpos_printer.feed
        target:
          device_id: "{{ device }}"
        data:
          lines: 30

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: "- - - - FOLD OVER HANDLE - - - -"
          align: center
          cut: none

      - service: escpos_printer.feed
        target:
          device_id: "{{ device }}"
        data:
          lines: 4

      # --- FRONT FACE (full details) ---
      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: "================================================"
          align: center
          bold: true
          cut: none

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: "{{ dest }}"
          align: center
          bold: true
          width: triple
          height: double
          cut: none

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: >-
            ================================================
            {% if origin | length > 0 %}{{ origin }}  -->  {{ dest }}{% endif %}
          align: center
          bold: true
          cut: none

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: "{{ name }}"
          align: center
          bold: true
          width: double
          height: double
          cut: none

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: >-
            {% if flight | length > 0 or date | length > 0 %}
            {% set parts = [] %}
            {% if flight | length > 0 %}{% set _ = parts.append(flight) %}{% endif %}
            {% if date | length > 0 %}{% set _ = parts.append(date) %}{% endif %}
            {{ parts | join('  |  ') }}
            {% endif %}
            {% if phone | length > 0 %}
            {{ phone }}
            {% endif %}
            {% if email | length > 0 %}
            {{ email }}
            {% endif %}
          align: center
          cut: none

      - service: escpos_printer.print_qr
        target:
          device_id: "{{ device }}"
        data:
          data: >-
            BEGIN:VCARD
            VERSION:3.0
            FN:{{ name }}
            {% if phone | length > 0 %}TEL;TYPE=CELL:{{ phone }}{% endif %}
            {% if email | length > 0 %}EMAIL:{{ email }}{% endif %}
            END:VCARD
          size: 6
          align: center
          cut: none

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: "================================================"
          align: center
          bold: true
          cut: partial
          feed: 3

  # =================================================================
  # DESIGN 2 — Bold & Visible
  # =================================================================
  #
  # ******* LUGGAGE TAG *******
  #
  #            L A X
  #
  #        JOHN Q. SMITH
  #
  #      +1 (555) 123-4567
  #     UA 1234 | 28 FEB 2026
  #
  # ******* LUGGAGE TAG *******
  #
  print_luggage_tag_bold:
    alias: Print Luggage Tag (Bold)
    icon: mdi:bag-suitcase
    variables:
      dest: "{{ states('input_text.luggage_destination') | upper | trim }}"
      name: "{{ states('input_text.luggage_passenger_name') | upper | trim }}"
      flight: "{{ states('input_text.luggage_flight_number') | upper | trim }}"
      date: "{{ states('input_text.luggage_travel_date') | upper | trim }}"
      phone: "{{ states('input_text.luggage_phone') | trim }}"
      device: YOUR_DEVICE_ID
    sequence:
      # --- BACK FACE ---
      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: "{{ dest }}"
          align: center
          bold: true
          width: "4"
          height: "4"
          cut: none

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: "{{ name }}"
          align: center
          bold: true
          width: double
          height: double
          cut: none

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: >-
            {% if phone | length > 0 %}{{ phone }}{% endif %}

            IF FOUND CALL ABOVE
          align: center
          bold: true
          cut: none

      # --- HANDLE GAP + FOLD LINE ---
      - service: escpos_printer.feed
        target:
          device_id: "{{ device }}"
        data:
          lines: 30

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: "- - - - FOLD OVER HANDLE - - - -"
          align: center
          cut: none

      - service: escpos_printer.feed
        target:
          device_id: "{{ device }}"
        data:
          lines: 4

      # --- FRONT FACE ---
      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: "******* LUGGAGE TAG *******"
          align: center
          bold: true
          cut: none
          feed: 1

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: "{{ dest }}"
          align: center
          bold: true
          width: "4"
          height: "4"
          cut: none

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: "{{ name }}"
          align: center
          bold: true
          width: double
          height: double
          cut: none
          feed: 1

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: >-
            {% if phone | length > 0 %}{{ phone }}{% endif %}
            {% if flight | length > 0 or date | length > 0 %}
            {% set parts = [] %}
            {% if flight | length > 0 %}{% set _ = parts.append(flight) %}{% endif %}
            {% if date | length > 0 %}{% set _ = parts.append(date) %}{% endif %}
            {{ parts | join(' | ') }}
            {% endif %}
          align: center
          bold: true
          width: double
          cut: none

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: "******* LUGGAGE TAG *******"
          align: center
          bold: true
          cut: partial
          feed: 3

  # =================================================================
  # DESIGN 3 — Contact Card
  # =================================================================
  #
  # ------------------------------------------------
  #  DEST     LAX
  #  FROM     JFK
  #  FLIGHT   UA 1234
  #  DATE     28 FEB 2026
  # ------------------------------------------------
  #  NAME     JOHN Q. SMITH
  #  PHONE    +1 (555) 123-4567
  #  EMAIL    john@example.com
  # ------------------------------------------------
  #
  #             [QR vCard]
  #
  #        Scan for contact info
  # ------------------------------------------------
  #
  print_luggage_tag_contact:
    alias: Print Luggage Tag (Contact)
    icon: mdi:bag-suitcase
    variables:
      dest: "{{ states('input_text.luggage_destination') | upper | trim }}"
      origin: "{{ states('input_text.luggage_origin') | upper | trim }}"
      name: "{{ states('input_text.luggage_passenger_name') | upper | trim }}"
      flight: "{{ states('input_text.luggage_flight_number') | upper | trim }}"
      date: "{{ states('input_text.luggage_travel_date') | upper | trim }}"
      phone: "{{ states('input_text.luggage_phone') | trim }}"
      email: "{{ states('input_text.luggage_email') | trim }}"
      device: YOUR_DEVICE_ID
    sequence:
      # --- BACK FACE ---
      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: >-
            ------------------------------------------------
            DEST     {{ dest }}
            NAME     {{ name }}
            {% if phone | length > 0 %}PHONE    {{ phone }}{% endif %}
            ------------------------------------------------

            IF FOUND PLEASE CONTACT
            OWNER USING DETAILS ABOVE
          align: left
          cut: none

      # --- HANDLE GAP + FOLD LINE ---
      - service: escpos_printer.feed
        target:
          device_id: "{{ device }}"
        data:
          lines: 30

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: "- - - - FOLD OVER HANDLE - - - -"
          align: center
          cut: none

      - service: escpos_printer.feed
        target:
          device_id: "{{ device }}"
        data:
          lines: 4

      # --- FRONT FACE ---
      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: >-
            ------------------------------------------------
            {% if dest | length > 0 %}DEST     {{ dest }}{% endif %}
            {% if origin | length > 0 %}FROM     {{ origin }}{% endif %}
            {% if flight | length > 0 %}FLIGHT   {{ flight }}{% endif %}
            {% if date | length > 0 %}DATE     {{ date }}{% endif %}
            ------------------------------------------------
          align: left
          cut: none

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: "{{ name }}"
          align: left
          bold: true
          width: double
          cut: none

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: >-
            {% if phone | length > 0 %}PHONE    {{ phone }}{% endif %}
            {% if email | length > 0 %}EMAIL    {{ email }}{% endif %}
            ------------------------------------------------
          align: left
          cut: none

      - service: escpos_printer.print_qr
        target:
          device_id: "{{ device }}"
        data:
          data: >-
            BEGIN:VCARD
            VERSION:3.0
            FN:{{ name }}
            {% if phone | length > 0 %}TEL;TYPE=CELL:{{ phone }}{% endif %}
            {% if email | length > 0 %}EMAIL:{{ email }}{% endif %}
            END:VCARD
          size: 8
          align: center
          cut: none

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: >-
            Scan for contact info
            ------------------------------------------------
          align: center
          cut: partial
          feed: 3
