      - delay:
          seconds: 1

      - service: escpos_printer.print_text_utf8
        target:
          device_id: "{{ device }}"
        data:
          text: "{{ name }}"
          align: center
          bold: true
          width: double
          height: double
          cut: none
          feed: 1

      - delay:
          seconds: 1

      - if:
          - condition: template
            value_template: "{{ phone | length > 0 }}"
